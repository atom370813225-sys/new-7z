name: Build New7z app (x64)

on:
  workflow_dispatch:
  push:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build native engine and publish app
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture x64

      - name: Confirm executable produced
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath 'artifacts/app/New7z.App.exe')) { throw 'New7z.App.exe missing' }
          Get-Item 'artifacts/app/New7z.App.exe' | Select-Object Name, Length

      - name: Run settings unit tests
        shell: pwsh
        run: dotnet run --project tests/New7z.Settings.Tests/New7z.Settings.Tests.csproj -c Release

      - name: Package app folder
        shell: pwsh
        run: Compress-Archive -Path artifacts/app/* -DestinationPath artifacts/New7z-x64-app.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: New7z-x64-app
          path: artifacts/New7z-x64-app.zip
          if-no-files-found: error
